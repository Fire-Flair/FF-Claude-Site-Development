<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:Cinzel;src:url(/home/claude/fonts/cinzel-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:Cinzel;src:url(/home/claude/fonts/cinzel-latin-700-normal.woff2) format("woff2");font-weight:700}
:root{--gold:#C9A227;--gl:#E7CB7A;--bur:#5C1220;--cream:#F4EFE4;--blk:#0B0B0C}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);font-family:Inter,sans-serif;padding:20px 16px;hyphens:none;word-break:normal;overflow-wrap:normal}
.cp{max-width:1148px;margin:0 auto;border-radius:26px;corner-shape:squircle;color:var(--cream);overflow:hidden;
 background:linear-gradient(135deg,#0B0A09 0%,#1C0E12 55%,#4A1220 100%);border:1px solid rgba(201,162,39,.45);padding:22px 18px 24px}
.eye{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gl);font-weight:600}
.coin{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 13px Cinzel;color:#3A2A08;
 background:radial-gradient(circle at 35% 30%,#FFF1BE,#E7CB7A 40%,#9C7A1E 100%);box-shadow:inset 0 0 0 2px rgba(60,40,0,.35)}
h2{font:700 clamp(26px,6.6vw,36px)/1.12 Cinzel;margin:12px 0 16px;color:#FFF6DC;letter-spacing:.01em}
.top{display:grid;gap:18px}
.btns{display:flex;gap:10px}
.btn{flex:1;min-height:48px;border-radius:14px;corner-shape:squircle;font:700 14px Inter;display:grid;place-items:center;padding:0 14px;white-space:nowrap}
.join{background:linear-gradient(180deg,#F3DD92,#C9A227 60%,#A9861E);color:#1A1204;letter-spacing:.1em;text-transform:uppercase;font-size:13px;box-shadow:0 6px 18px rgba(201,162,39,.35)}
.rules{border:1px solid rgba(201,162,39,.65);color:#F4DC8E}
.cd{display:flex;align-items:center;gap:10px}
.cd .l{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gl);font-weight:600;margin-right:4px}
.cd span:not(.l){display:flex;flex-direction:column;align-items:center;min-width:58px;padding:6px 8px;border-radius:14px;corner-shape:squircle;border:1px solid rgba(201,162,39,.5);background:rgba(244,239,228,.05)}
.cd b{font-size:22px;font-variant-numeric:tabular-nums}.cd small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gl)}
.tiles{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px;margin-top:20px}
.t{border-radius:18px;corner-shape:squircle;border:1px solid rgba(201,162,39,.4);background:rgba(244,239,228,.05);padding:14px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.ic{width:44px;height:44px;border-radius:13px;corner-shape:squircle;display:grid;place-items:center;background:rgba(201,162,39,.14);border:1px solid rgba(201,162,39,.55);color:var(--gl)}
.ic svg{width:22px;height:22px}
.t b{font-size:15px;line-height:1.25;color:#FFF6DC}
.t em{font-style:normal;font-size:13px;line-height:1.35;color:rgba(244,239,228,.85)}
.lad{margin-top:24px}
.track{position:relative;height:12px;border-radius:12px;background:rgba(244,239,228,.14);border:1px solid rgba(201,162,39,.45);margin:0 9px}
.fill{position:absolute;left:0;top:0;bottom:0;width:4%;border-radius:12px;background:linear-gradient(90deg,#8C6A1F,#E7CB7A)}
.dot{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#1C0E12;border:2px solid rgba(201,162,39,.7)}
.dot.on{background:var(--gl);border-color:var(--cream)}
.stops{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.s{display:flex;flex-direction:column;gap:3px}
.s .n{font:700 20px Cinzel;color:var(--gl)}
.s span{font-size:13px;line-height:1.3;color:rgba(244,239,228,.92)}
.s.m{align-items:center;text-align:center}.s.r{align-items:flex-end;text-align:right}
@media(min-width:900px){
 .cp{padding:30px 34px 32px}
 .top{grid-template-columns:1fr auto;align-items:end}
 .tiles{grid-template-columns:repeat(4,1fr)}
 .btns{max-width:420px}
}
</style></head><body>
<section class="cp">
 <div class="top">
  <div>
   <div class="eye"><span class="coin">FF</span>FF Team Launch Challenge</div>
   <h2>Grow your Team. Win&nbsp;prizes.</h2>
   <div class="btns"><span class="btn join">Join Challenge</span><span class="btn rules">Rules</span></div>
  </div>
  <div class="cd"><span class="l">Starts in</span><span><b>12</b><small>days</small></span><span><b>22</b><small>hours</small></span><span><b>21</b><small>mins</small></span></div>
 </div>
 <div class="tiles">
  <div class="t"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span><b>90 days</b><em>1 Dec to 28 Feb</em></div>
  <div class="t"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><b>Open to all</b><em>Hospitality and newcomers</em></div>
  <div class="t"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.5 13.5 17 22l-5-3-5 3 1.5-8.5"/></svg></span><b>Top 10 go Gold</b><em>Gold membership</em></div>
  <div class="t"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></span><b>Win Athens</b><em>Athens Bar Show trip</em></div>
 </div>
 <div class="lad">
  <div class="track"><span class="fill"></span><i class="dot on" style="left:0"></i><i class="dot" style="left:50%"></i><i class="dot" style="left:100%"></i></div>
  <div class="stops">
   <div class="s"><span class="n">7</span><span>Joined</span></div>
   <div class="s m"><span class="n">100</span><span>Bookings go live</span></div>
   <div class="s r"><span class="n">1,000</span><span>Launch party and nationwide campaign</span></div>
  </div>
 </div>
</section>
</body></html>
