<!doctype html>
<html lang="en-GB">
<head>

<title>FireFlair Business &amp; Support Module</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cinzel:wght@400;500;600;700&display=swap">
<style>
body { margin:0; background:#F4EFE4; font-family:'Inter', ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
.ff-demo { max-width:760px; margin:0 auto; padding:24px 16px 40px; }
.ff { --display: var(--font-display, 'Cinzel', 'Optima', 'Palatino Linotype', Georgia, serif); --gold-dk: #7E611D; }
/* v17.3.74: Business & Support module (compact) */
.ff .ff-biz19 { padding-top:16px; }
.ff .ff-biz19-box { border-radius:20px; corner-shape:squircle; padding:12px 14px; border:1.5px solid #B08D2A; background:radial-gradient(120% 80% at 50% 0%, #FFFDF4 0%, #F6EBCB 55%, #EBD9A3 100%); box-shadow:0 14px 26px -22px rgba(60,40,6,.5), inset 0 0 0 3px rgba(255,251,238,.9), inset 0 0 0 4px rgba(176,141,42,.45); }
.ff .ff-biz19-h { margin:0 0 6px; font-family:var(--display); font-size:17px; line-height:1.15; letter-spacing:.02em; color:#16130F; }
.ff .ff-biz19-grid { display:grid; grid-template-columns:minmax(0,1fr); gap:8px; }
@media (min-width:640px) { .ff .ff-biz19-grid { grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:20px; align-items:start; } }
.ff .ff-biz19-lead { margin:0 0 4px; font-size:12.5px; line-height:1.4; color:#2E2209; }
.ff .ff-biz19-dl { margin:0; font-size:12.5px; line-height:1.4; color:#2E2209; }
.ff .ff-biz19-row { display:flex; gap:8px; margin:0; padding:2px 0; }
.ff .ff-biz19-row dt { flex:none; width:92px; padding-top:1px; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; white-space:nowrap; color:#7A5E14; }
.ff .ff-biz19-row dd { min-width:0; margin:0; overflow-wrap:normal; word-break:normal; hyphens:none; }
.ff .ff-biz19-nb { white-space:nowrap; }
.ff .ff-biz19-sup { display:flex; flex-wrap:wrap; align-content:flex-start; gap:6px 8px; min-width:0; }
.ff .ff-biz19-sup h3 { flex:0 0 100%; margin:0; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#7A5E14; }
@media (min-width:640px) { .ff .ff-biz19-sup { flex-direction:column; flex-wrap:nowrap; align-items:flex-start; } .ff .ff-biz19-sup h3 { flex:none; } }
.ff .ff-biz19-link { display:inline-flex; align-items:center; gap:8px; padding:6px 11px; border:1.5px solid rgba(176,141,42,.65); border-radius:14px; corner-shape:squircle; background:#fff; color:#2E2209; font-size:13.5px; font-weight:700; text-decoration:none; white-space:nowrap; }
.ff .ff-biz19-link svg { flex:none; color:#7A5E14; }
.ff .ff-biz19-link:focus-visible { outline:2px solid var(--gold-dk); outline-offset:3px; }
.ff .ff-biz19-legal { margin:10px 0 0; padding-top:8px; border-top:1px solid rgba(176,141,42,.4); font-size:11px; line-height:1.45; color:#5A4A1C; }
</style>
</head>
<body>

</html>
